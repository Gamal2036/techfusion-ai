apiVersion: v1
kind: Secret
metadata:
  name: {{ include "techfusion.fullname" . }}-secrets
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "techfusion.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_PASSWORD: {{ required "postgresql.password is required" .Values.postgresql.password | b64enc }}
  JWT_SECRET: {{ required "secrets.jwtSecret is required" .Values.secrets.jwtSecret | b64enc }}
  JWT_REFRESH_SECRET: {{ required "secrets.jwtRefreshSecret is required" .Values.secrets.jwtRefreshSecret | b64enc }}
  ENCRYPTION_KEY: {{ required "secrets.encryptionKey is required" .Values.secrets.encryptionKey | b64enc }}
  STRIPE_SECRET_KEY: {{ .Values.secrets.stripeSecretKey | default "" | b64enc }}
  STRIPE_WEBHOOK_SECRET: {{ .Values.secrets.stripeWebhookSecret | default "" | b64enc }}
  POSTGRES_USER: {{ .Values.postgresql.user }}
  POSTGRES_DB: {{ .Values.postgresql.database }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "techfusion.fullname" . }}-postgres-credentials
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "techfusion.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_USER: {{ .Values.postgresql.user }}
  POSTGRES_PASSWORD: {{ required "postgresql.password is required" .Values.postgresql.password | b64enc }}
  POSTGRES_DB: {{ .Values.postgresql.database }}
