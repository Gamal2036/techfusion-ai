global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'techfusion-api-gateway'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['api-gateway:3001']
        labels:
          service: 'api-gateway'
    scrape_interval: 15s

  - job_name: 'techfusion-worker'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['worker:9464']
        labels:
          service: 'worker'
    scrape_interval: 15s

  - job_name: 'techfusion-health-api'
    metrics_path: '/health'
    static_configs:
      - targets: ['api-gateway:3001']
        labels:
          service: 'api-gateway-health'
    scrape_interval: 30s

  - job_name: 'techfusion-health-worker'
    metrics_path: '/health'
    static_configs:
      - targets: ['worker:9465']
        labels:
          service: 'worker-health'
    scrape_interval: 30s

rule_files:
  - '/etc/prometheus/alert-rules.yml'
